version: '3.8'
services:
  openwa-bot:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
    environment:
      - OPENWA_API_KEY=replace_with_openwa_api_key
      - WHATSAPP_SESSION_ID=team-egb
      - WHATSAPP_HEADLESS=false
      - PORT=8080
